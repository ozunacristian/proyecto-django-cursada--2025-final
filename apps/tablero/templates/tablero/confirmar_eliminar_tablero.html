{% extends 'base.html' %}

{% block titulo %}Eliminar Tablero{% endblock %}

{% block contenido %}
<h2>¿Eliminar el Tablero "{{ object.titulo }}"?</h2>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>

<a href="{% url 'detalle_tablero' object.pk %}">Volver</a>
{% endblock %}
