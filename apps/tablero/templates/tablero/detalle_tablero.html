{% extends 'base.html' %}

{% block titulo %}Detalle del Tablero{% endblock %}

{% block contenido %}
<h2>{{ tablero.titulo }}</h2>

<p>{{ tablero.descripcion }}</p>

<p><strong>Creado por:</strong> {{ tablero.creado_por.username }}</p>
<p><strong>Fecha:</strong> {{ tablero.fecha_creacion }}</p>

<hr>

<a href="{% url 'eliminar_tablero' tablero.pk %}">Eliminar este tablero</a>
{% endblock %}
