{% extends 'base.html' %}

{% block content %}
<h1>{{ object.titulo }}</h1>

<p>{{ object.descripcion|default:"Sin descripción" }}</p>

<p>Creado por: {{ object.creado_por.username|default:"Desconocido" }}</p>
<p>Fecha: {{ object.fecha_creacion|date:"d/m/Y" }}</p>

<a href="{% url 'editar_tablero' object.id %}">Editar</a>
<a href="{% url 'eliminar_tablero' object.id %}">Eliminar</a>
<a href="{% url 'lista_tableros' %}">Volver</a>
{% endblock %}
