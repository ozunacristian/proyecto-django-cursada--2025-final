{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card border-danger shadow">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">Eliminar comentario</h5>
        </div>
        <div class="card-body">
            <p>Vas a eliminar este comentario:</p>
            <blockquote class="blockquote ps-3 border-start">{{ comentario.contenido }}</blockquote>

            <form method="post" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Eliminar</button>
                <a href="{% url 'ticket:detalle_ticket' comentario.ticket.id %}" class="btn btn-outline-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
