{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Mi perfil</h4>
            </div>
            <div class="card-body">
                <p class="mb-2"><strong>Usuario:</strong> {{ user.username }}</p>
                <p class="mb-2"><strong>Email:</strong> {{ user.email|default:"-" }}</p>
                <p class="mb-0"><strong>Rol:</strong>
                    {% if perfil %}
                        {{ perfil.get_rol_display }}
                    {% else %}
                        Sin perfil
                    {% endif %}
                </p>

                
            </div>
            
        </div>
        
        <p class="text-end mt-2">
                <a href="javascript:history.back()"><button type="button" class="btn btn-light">Volver</button></a>
        </p>
    </div>
</div>
{% endblock %}
