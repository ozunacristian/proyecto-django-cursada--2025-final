<!DOCTYPE html>
<html>
<head>
    <title>Gestor Castor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Gestor Castor</a>
            
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'lista_tableros' %}">Tableros</a>
                
                {% if user.is_authenticated %}
                    <span class="nav-link">Hola, {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'admin:logout' %}">Salir</a>
                {% else %}
                    <a class="nav-link" href="{% url 'admin:login' %}">Ingresar</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="container mt-3">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
