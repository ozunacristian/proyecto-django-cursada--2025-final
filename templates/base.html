<!DOCTYPE html>
<html>
<head>
    <title>Gestor Castor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'lista_tableros' %}">Gestor Castor</a>
            
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'lista_tableros' %}">Tableros</a>
                
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'usuario:perfil' %}">Hola, {{ user.username }}</a>
                    <form method="post" action="{% url 'usuario:logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="nav-link btn btn-link">Salir</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'usuario:login' %}">Ingresar</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="container mt-3">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
